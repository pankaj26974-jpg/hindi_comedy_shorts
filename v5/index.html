<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindi Comedy Studio V5</title><style> *{box-sizing:border-box}body{margin:auto;max-width:760px;background:#101526;color:#f4f5ff;font:16px system-ui;padding:16px}section{background:#20283d;padding:16px;border-radius:16px;margin:14px 0}h1{color:#ffc66d}h2{font-size:19px}label{display:block;margin:12px 0 5px}button,select,input,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #53617d;max-width:100%;margin:5px 0}button{background:#ffc66d;color:#171c28;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}textarea,select,input{background:#11182b;color:white;width:100%}textarea{min-height:75px}canvas{width:100%;max-width:300px;display:block;margin:auto;border-radius:12px}img{max-width:100%;max-height:180px}small{color:#bdc8df}article{border-top:1px solid #53617d;padding:12px 0}audio{width:100%}a{color:#9ef5cb}</style><h1>😂 Hindi Comedy Studio V5</h1><small>Mixed Comedy • Free • 9:16</small><section><h2>1. कहानी बनाएं</h2><label>विषय</label><select id="topic"><option value="random">Random Mixed</option><option value="family">Family</option><option value="office">Office</option><option value="tech">Mobile</option><option value="school">School</option><option value="shop">Market</option></select><label>Visual style</label><select id="style"><option>Mixed</option><option>3D cartoon</option><option>Realistic</option><option>Meme</option></select><button id="generate">Generate Comedy Scenes</button><div id="scenes"></div></section><section><h2>2. आवाज़ और म्यूजिक</h2><button id="record">Start Recording</button> <button id="stop" disabled>Stop Recording</button><p id="mic">HTTPS पर माइक्रोफोन अनुमति दें।</p><audio id="voice" controls></audio><label>या अपनी voice audio file चुनें</label><input id="voicefile" type="file" accept="audio/*"><label>Background music (optional)</label><input id="music" type="file" accept="audio/*"><label>Music volume</label><input id="volume" type="range" min="0" max="0.5" step="0.01" value="0.12"><small>अपने अधिकार वाली तस्वीरें और म्यूजिक ही इस्तेमाल करें।</small></section><section><h2>3. Preview और Export</h2><canvas id="canvas" width="540" height="960"></canvas><button id="preview">Preview Scenes</button> <button id="render">Render & Save Video</button><p id="status" role="status"></p><a id="download" hidden>Download Video</a><small>WebM या समर्थित MP4 • पेज खुला रखें।</small></section><script>
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d');
const stories=[['family','Indian living room',['मम्मी: बेटा, कमरा साफ किया?','बेटा: हाँ, सब सामान बिस्तर के नीचे है।','मम्मी: तो झाड़ू कहाँ है?','बेटा: वो भी वहीं आराम कर रही है!']],['office','Indian office',['बॉस: आज फिर देर क्यों हुई?','कर्मचारी: सर, सपने में ऑफिस आया था।','बॉस: तो जल्दी उठ जाते!','कर्मचारी: सर, सपने में भी मीटिंग चल रही थी!']],['tech','Indian home, smartphone',['पापा: फोन से क्या सीख रहे हो?','बेटा: गणित सीख रहा हूँ।','पापा: कौन सा गणित?','बेटा: कितनी बैटरी बची है!']],['school','Indian classroom',['टीचर: होमवर्क कहाँ है?','छात्र: मैम, कॉपी घर पर है।','टीचर: और तुम यहाँ क्यों आए?','छात्र: कॉपी को छुट्टी चाहिए थी!']],['shop','Indian market stall',['ग्राहक: सबसे सस्ता क्या है?','दुकानदार: सलाह।','ग्राहक: तो एक सलाह दे दो।','दुकानदार: पहले पैसे लेकर आओ!']],['family','Indian dining room',['पापा: रिजल्ट कैसा आया?','बेटा: मैं क्लास में सबसे अलग हूँ।','पापा: वाह! कैसे?','बेटा: बाकी सब पास हैं!']]];
let scenes=[],voiceBlob=null,voiceURL=null,micRec=null,micStream=null,busy=false,downloadURL=null;
function generate(){if(busy)return;let pool=stories.filter(s=>$('topic').value==='random'||s[0]===$('topic').value),s=pool[Math.floor(Math.random()*pool.length)];scenes=s[2].map((line,i)=>({line,seconds:5,img:null,prompt:`${$('style').value==='Mixed'?'Expressive 3D cartoon':$('style').value} Indian comedy, ${s[1]}, consistent characters, scene ${i+1}: ${line}, vertical 9:16, no text, no watermark`}));$('scenes').replaceChildren();scenes.forEach((s,i)=>{let a=document.createElement('article');a.innerHTML=`<b>Scene ${i+1}</b><label>Dialogue / subtitle</label><textarea></textarea><label>Duration (seconds)</label><input type="number" min="2" max="20" value="5"><label>Scene image</label><input type="file" accept="image/*"><img hidden><label>AI Image Prompt</label><textarea readonly></textarea><button>Copy Prompt</button>`;let [caption,prompt]=a.querySelectorAll('textarea'),[duration,file]=a.querySelectorAll('input'),img=a.querySelector('img');caption.value=s.line;prompt.value=s.prompt;caption.oninput=()=>s.line=caption.value;duration.onchange=()=>{s.seconds=Math.max(2,Math.min(20,Number(duration.value)||5));duration.value=s.seconds};file.onchange=()=>{if(!file.files[0])return;let url=URL.createObjectURL(file.files[0]),im=new Image();im.onload=()=>{s.img=im;img.src=url;img.hidden=false;draw(i,0)};im.onerror=()=>{$('status').textContent='Image format not supported';URL.revokeObjectURL(url)};im.src=url};a.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(prompt.value);a.querySelector('button').textContent='Copied'}catch(e){prompt.select()}};$('scenes').append(a)});draw(0,0)}
function draw(i,p){let s=scenes[i];if(!s)return;let g=ctx.createLinearGradient(0,0,540,960);g.addColorStop(0,'#493b85');g.addColorStop(1,'#101526');ctx.fillStyle=g;ctx.fillRect(0,0,540,960);if(s.img){let z=Math.max(540/s.img.width,960/s.img.height)*(1+p*.08),w=s.img.width*z,h=s.img.height*z;ctx.drawImage(s.img,(540-w)/2,(960-h)/2,w,h)}else{ctx.textAlign='center';ctx.font='130px sans-serif';ctx.fillText(['😎','🤔','😳','🤣'][i%4],270,440)}ctx.fillStyle='#000b';ctx.fillRect(0,0,540,90);ctx.fillRect(0,680,540,280);ctx.fillStyle='#ffca70';ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillText('HINDI COMEDY',270,56);let words=s.line.split(/\s+/),lines=[],line='';ctx.font='bold 34px sans-serif';for(let w of words){let t=line?line+' '+w:w;if(ctx.measureText(t).width>470&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);let size=Math.min(34,Math.floor(190/Math.max(1,lines.length)));ctx.font=`bold ${size}px sans-serif`;ctx.fillStyle='white';lines.forEach((l,j)=>ctx.fillText(l,270,735+j*(size+5),470));ctx.font='20px sans-serif';ctx.fillText(`${i+1} / ${scenes.length}`,270,930)}
function setVoice(blob){voiceBlob=blob;if(voiceURL)URL.revokeObjectURL(voiceURL);voiceURL=URL.createObjectURL(blob);$('voice').src=voiceURL;$('mic').textContent='Voice ready'}
$('voicefile').onchange=()=>{if($('voicefile').files[0])setVoice($('voicefile').files[0])};$('record').onclick=async()=>{try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});let parts=[];micRec=new MediaRecorder(micStream);micRec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};micRec.onstop=()=>{setVoice(new Blob(parts,{type:micRec.mimeType}));micStream.getTracks().forEach(t=>t.stop());$('record').disabled=false;$('stop').disabled=true};micRec.start();$('record').disabled=true;$('stop').disabled=false;$('mic').textContent='Recording…'}catch(e){$('mic').textContent=e.message;micStream?.getTracks().forEach(t=>t.stop())}};$('stop').onclick=()=>{if(micRec?.state==='recording')micRec.stop()};
function timeline(t){let i=0;while(i<scenes.length-1&&t>=scenes[i].seconds){t-=scenes[i].seconds;i++}draw(i,Math.min(1,t/scenes[i].seconds))}function animate(total){return new Promise(resolve=>{let start=performance.now();function tick(now){let t=(now-start)/1000;timeline(t);$('status').textContent=`${Math.min(total,t).toFixed(1)} / ${total} seconds`;if(t>=total)resolve();else requestAnimationFrame(tick)}requestAnimationFrame(tick)})}function lock(v){busy=v;document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=v);if(!v)$('stop').disabled=micRec?.state!=='recording'}
$('preview').onclick=async()=>{if(busy||micRec?.state==='recording')return;lock(true);await animate(scenes.reduce((n,s)=>n+s.seconds,0));lock(false);$('status').textContent='Visual preview complete (silent)'};
$('render').onclick=async()=>{if(busy||micRec?.state==='recording')return;lock(true);let ac,stream,out,rec,sources=[];try{if(!window.MediaRecorder||!c.captureStream)throw Error('Browser does not support video recording');let total=scenes.reduce((n,s)=>n+s.seconds,0);ac=new AudioContext();await ac.resume();let dest=ac.createMediaStreamDestination();for(let [file,vol,loop] of [[voiceBlob,1,false],[$('music').files[0],Number($('volume').value),true]]){if(!file)continue;let buf=await ac.decodeAudioData(await file.arrayBuffer()),src=ac.createBufferSource(),gain=ac.createGain();src.buffer=buf;src.loop=loop;gain.gain.value=vol;src.connect(gain).connect(dest);sources.push(src)}draw(0,0);stream=c.captureStream(24);out=new MediaStream([...stream.getVideoTracks(),...(sources.length?dest.stream.getAudioTracks():[])]);let mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:2500000}:undefined);let parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};let done=new Promise((resolve,reject)=>{rec.onstop=()=>resolve(new Blob(parts,{type:rec.mimeType}));rec.onerror=e=>reject(e.error)});rec.start(200);sources.forEach(s=>s.start());await animate(total);rec.stop();let blob=await done;if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);let a=$('download');a.href=downloadURL;a.download='hindi-comedy-v5.'+(blob.type.includes('mp4')?'mp4':'webm');a.hidden=false;a.textContent='Download Video ('+(blob.size/1048576).toFixed(2)+' MB)';a.click();$('status').textContent='Video ready!'}catch(e){$('status').textContent='Export error: '+e.message}finally{sources.forEach(s=>{try{s.stop()}catch(e){}});if(rec?.state==='recording')rec.stop();out?.getTracks().forEach(t=>t.stop());stream?.getTracks().forEach(t=>t.stop());if(ac)await ac.close();lock(false)}};$('generate').onclick=generate;generate();</script></html>
